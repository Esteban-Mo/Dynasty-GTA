services:
  postgres:
    image: postgres:16
    container_name: immo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: immo
    ports:
      - "5432:5432"           # accessible en local uniquement
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d immo"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
